
name: JeeLink Parser Tests

on:
  push:
    branches:
      - main
      - feature/pylacrosse-ng
    paths:
      - "tests/**"
      - "custom_components/lacrosse_jeelink/**"
      - ".github/workflows/parser-tests.yml"
  pull_request:
    paths:
      - "tests/**"
      - "custom_components/lacrosse_jeelink/**"
      - ".github/workflows/parser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-tests:
    name: Python Parser Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pylacrosse>=0.4"

      - name: Inspect installed pylacrosse
        run: |
          python - <<'PY'
          import inspect
          from importlib.metadata import version

          import pylacrosse

          print("===== PYLACROSSE VERSION =====")
          print(version("pylacrosse"))

          print("\n===== PYLACROSSE MODULE =====")
          print(inspect.getfile(pylacrosse.LaCrosse))

          print("\n===== LACROSSE _refresh =====")
          print(inspect.getsource(pylacrosse.LaCrosse._refresh))

          print("\n===== LACROSSE SENSOR CLASS =====")
          print(inspect.getsource(pylacrosse.LaCrosseSensor))
          PY

      - name: Run JeeLink parser tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v
